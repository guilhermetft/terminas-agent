# Termina's Agent - exemplo de configuracao.
# Copie para config.yaml. Nunca versione chaves reais: use variaveis de ambiente.

behavior:
  tone: tecnico
  verbosity: conciso
  language: pt-BR
  rules: []

# Para usar um modelo de IA nao e preciso editar este arquivo: rode `terminas` e use /login
# (a chave fica em ~/.terminas/.env). As chaves de llm.api_keys sao opcionais (automacao/CI).
llm:
  default_model: gemini/gemini-2.5-flash   # dica de modelo; /login e /model escolhem o ativo
  triage_model: gemini/gemini-2.5-flash    # modelo rapido/barato para triagem
  api_keys:
    anthropic: ${ANTHROPIC_API_KEY}
    gemini: ${GEMINI_API_KEY}
    openai: ${OPENAI_API_KEY}

limits:
  max_steps: 15
  timeout_seconds: 120

paths:
  data_dir: .terminas
  auth_dir: ~/.terminas            # credenciais do /login (a variavel TERMINAS_HOME tem prioridade)
  log_file: null                   # padrao: <data_dir>/logs/audit.jsonl

# Servidores MCP (stdio) cujas ferramentas viram skills "mcp.<servidor>.<ferramenta>".
# Requer: pip install -e ".[mcp]". Exemplo (ajuste ao servidor que voce usa):
mcp_servers: []
#  - name: google-workspace        # nome padrao esperado pela skill google-workspace
#    command: <executavel-do-servidor>
#    args: ["--flag"]
#    timeout_seconds: 30

skills:
  vault_dir: null                  # pasta de um vault Markdown/Obsidian para a skill quick-notes
  plugins_dir: src/skills/plugins  # skills extras (.py) descobertas na inicializacao
